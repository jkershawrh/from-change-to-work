[workspace]

[package]
name = "aeris-skill-transfer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[features]
fault-injection = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2.2"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
libc = "0.2"
aeris-control-v2 = { path = "../../proof/control_v2/controller" }

[dev-dependencies]
tempfile = "3"
