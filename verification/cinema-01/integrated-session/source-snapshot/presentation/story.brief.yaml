version: 1
blueprint: demo-blueprint.yaml
presentation:
  title: Capability travels. Control stays.
  audience: Aerospace manufacturing owners, Red Hat and Intel partners, edge platform engineers
  desired_decision: Qualify one approved task transfer on named central and edge compute, then a reviewed physical profile.
  duration_minutes: 6
  core_tension: A centrally delivered capability must survive transfer failure without outsourcing local execution authority.
  cta: Continue into the same dashboard and hardware acceptance workflow.
source_material:
  mode: repository
  items: [demo-blueprint.yaml, ../verification/onboarding-01/result.json, ../docs/PRESTON.md]
  consequential_assumptions:
    - Aerospace cell and airframe geometry are illustrative. The executable plant is MuJoCo.
    - No measured production savings, throughput, coverage, physical actuation or real-time claim.
    - Narrated film is a labeled retained-evidence rehearsal. A deliberate live observation is separately labeled.
creative_direction:
  format: Continuous 3D cell with seven chapters, camera choreography, blueprints, exploded views, subtle particles, layered hardware and software, and matching saved Kersh voice.
  recurring_object: One illuminated signed recipe crossing the central-to-edge boundary, then one receipt returning as evidence.
  opening: Aircraft structure and a robotic cell; the central connection visibly goes dark while local authority stays illuminated.
  mechanism: Camera enters the edge enclosure, reveals the signature gate and retained state, then pulls back to the cell.
  ending: Same release process, profile-specific modules, scoped evidence and a deliberate hardware handoff.
  pacing: Natural voice speed 1.0. Complete narrative generation with chapter pauses and a held close; no stretched audio or clipped speech.
  accessibility: Captions, keyboard and touch navigation, deep links, reduced-motion stills, fullscreen and presenter notes.
beats:
  - {scene: cell, beat: ordinary-world, question: Who owns the next move when the connection disappears?}
  - {scene: recipe, beat: reframe, question: What actually needs to travel?}
  - {scene: architecture, beat: system-reveal, question: Who verifies and activates the task?}
  - {scene: disconnect, beat: live-proof, question: What survives the central cut?}
  - {scene: recovery, beat: trials, question: What does an interruption really leave behind?}
  - {scene: ecosystem, beat: transformation, question: Can the process repeat without pretending every robot is the same?}
  - {scene: qualify, beat: next-journey, question: What do we prove next on your hardware?}
evidence:
  - {id: contracts, classification: verified-fact, source: ../crates/aeris-skill-transfer/src, treatment: Signed deterministic recipes and local admission; no model download claim.}
  - {id: recorded, classification: verified-fact, source: /action-proof.json, treatment: Clearly labeled historical simulator samples and Intel/RHEL scope.}
  - {id: local-audit, classification: verified-fact, source: ../verification/onboarding-01/result.json, treatment: Historical local independent audit only.}
  - {id: live, classification: live-measurement, source: /api/action-demo/export, treatment: Explicit read-only current-session observation; never independent qualification.}
  - {id: set, classification: rehearsal-fixture, source: src/cinema/World.tsx, treatment: Aerospace set and animated transfer are illustrations.}
  - {id: physical, classification: future-state, source: ../docs/PRESTON.md, treatment: Physical profiles and hardware acceptance remain pending.}
journey:
  presentation: Narrated autonomous story and presenter-paced traversal share chapters and source labels.
  guided_demo: Question-first architecture, hover inspection, mechanism detail and persistent current-session observations.
  live_demonstration: Deliberate authenticated observation; actual transfer and fault controls remain in the working workbench.
  hands_on_lab: Existing agent start packet, read-only preflight and current acceptance workflow.
  handoff: Same-origin dashboard, preserving backend session and deliberate operator authority.
voice:
  profile: audio/voice-profile.json
  source: Plan a two-week visibility strategy / cascade-story-two voice-production.json
  model: eleven_v3
  settings: {stability: 0.5, similarity_boost: 0.8, style: 0.3, use_speaker_boost: true, speed: 1.0}
acceptance:
  - Seven chapters fit within one desktop viewport at 1920x1080 and 1440x900; narrow rehearsal may scroll.
  - Inspect every internal architecture question/answer, exploded view, blueprint and evidence drawer.
  - No actuation from story playback, seeking, hover, replay, export or narration.
  - No current-session numerical payoff before explicit successful observation.
  - Pausing, seeking, restarting and chapter navigation keep voice and visuals synchronized.
  - Narration and final encoded video retain the complete closing, with no clipped audio.
